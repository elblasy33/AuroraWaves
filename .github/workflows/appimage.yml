# Builds the AppImage in Ubuntu 22.04 (glibc 2.35) with packaging/appimage/in-container.sh,
# the same script build.sh runs locally in Docker. Artifact: Actions → this run → Artifacts.
name: AppImage

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build"
        required: false
        default: main
  push:
    tags: ["v*"]

jobs:
  appimage:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged
    steps:
      - name: Get git
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Build
        run: |
          ln -s "$GITHUB_WORKSPACE" /src
          cd /src && mkdir -p dist
          HOST_UID=$(id -u) HOST_GID=$(id -g) sh packaging/appimage/in-container.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/*.zsync

  test:
    # Close to AppImageHub's test: a bare Ubuntu 22.04 with only what any desktop has, X11, no network
    needs: appimage
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - name: A bare desktop base (no Qt, no xcb helpers, no Python)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            xvfb xauth libgl1 libegl1 libfontconfig1 fonts-dejavu-core libdbus-1-3 libxkbcommon0 \
            libx11-xcb1 libxcb1 libxrender1 libxi6 libglib2.0-0 desktop-file-utils >/dev/null
      - name: Desktop file passes Ubuntu 22.04's desktop-file-validate (as AppImageHub checks it)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x Aurora_Waves-*.AppImage
          ./Aurora_Waves-*.AppImage --appimage-extract '*.desktop' >/dev/null
          desktop-file-validate squashfs-root/*.desktop
      - name: Starts offline on X11 and shows its window
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: xcb
          AURORA_SHOT: /tmp/appimage-shot.png
          AURORA_SHOT_MS: "15000"
        run: |
          chmod +x Aurora_Waves-*.AppImage
          unshare -n true 2>/dev/null && NONET="unshare -n" || NONET=""
          timeout 90 xvfb-run -a -s "-screen 0 1280x800x24" $NONET ./Aurora_Waves-*.AppImage
          ls -l /tmp/appimage-shot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-screenshot
          path: /tmp/appimage-shot.png
