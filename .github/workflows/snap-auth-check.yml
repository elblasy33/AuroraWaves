# Checks that the SNAPCRAFT_STORE_CREDENTIALS secret is still accepted by the Snap Store.
# Prints only "valid" or "rejected": the logs of this public repository must not show the account.
name: Snap Store login check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic >/dev/null
      - name: Ask the store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if snapcraft whoami >/dev/null 2>&1; then echo "credentials: valid"; else echo "credentials: rejected"; exit 1; fi
