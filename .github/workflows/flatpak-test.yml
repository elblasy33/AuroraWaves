# Smoke test of a built Flatpak, inside the sandbox: libraries, radio, YouTube via yt-dlp, window.
# Runs after every Flatpak build, or by hand for an older build: Actions → Flatpak test → Run → run id.
name: Flatpak test

on:
  workflow_run:
    workflows: [Flatpak]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the Flatpak build to test"
        required: true

permissions:
  actions: read          # download the bundle from the build run
  contents: read

jobs:
  test:
    name: Smoke test the Flatpak
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9
      options: --privileged
    env:
      APP: io.github.elblasy33.AuroraWaves
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aurora-waves-x86_64.flatpak
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install the bundle and its runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Platform//6.11
          flatpak install --user -y --noninteractive aurora-waves.flatpak
      - name: Libraries load inside the sandbox
        run: |
          flatpak run --command=sh $APP -c '
            mpv --version | head -1
            python3 -c "import sys, gi, PySide6, ytmusicapi, yt_dlp; from gi.repository import Gio; \
              print(sys.version.split()[0], \"PySide6\", PySide6.__version__, \"gi\", gi.__version__, \"yt-dlp\", yt_dlp.version.__version__)"
            python3 -c "from aurorawaves.core import ytmusic; s = ytmusic.status(); print(\"YouTube Music ready:\", s[\"ready\"]); assert s[\"ready\"]"
          '
      - name: mpv plays a radio stream
        run: flatpak run --command=mpv $APP --no-video --ao=null --length=5 https://stream.zeno.fm/5277mqf2sxhvv
      - name: mpv plays a YouTube Music song through yt-dlp (YouTube may block CI)
        continue-on-error: true
        run: flatpak run --command=mpv $APP --no-video --ao=null --length=5 "https://music.youtube.com/watch?v=6fRmldi8TAY"
      - name: The window opens (offscreen screenshot)
        run: |
          mkdir -p ~/.var/app/$APP
          xvfb-run -a flatpak run --env=AURORA_SHOT=$HOME/.var/app/$APP/shot.png --env=AURORA_SHOT_MS=12000 \
              --env=QT_QPA_PLATFORM=xcb $APP || true
          ls -l ~/.var/app/$APP/shot.png
          cp ~/.var/app/$APP/shot.png flatpak-shot.png
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-screenshot
          path: flatpak-shot.png
