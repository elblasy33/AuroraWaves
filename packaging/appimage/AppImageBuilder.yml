# AppImage (appimage-builder).   appimage-builder --recipe packaging/appimage/AppImageBuilder.yml
version: 1
script:
  - rm -rf AppDir && mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
  - python3 -m pip install --target AppDir/usr/lib/python3/dist-packages PySide6-Essentials ytmusicapi yt-dlp .
  - cp data/io.github.elblasy33.AuroraWaves.desktop AppDir/usr/share/applications/
  - cp data/icons/hicolor/scalable/apps/io.github.elblasy33.AuroraWaves.svg AppDir/usr/share/icons/hicolor/scalable/apps/
AppDir:
  path: ./AppDir
  app_info:
    id: io.github.elblasy33.AuroraWaves
    name: Aurora Waves
    icon: io.github.elblasy33.AuroraWaves
    version: 0.1.0
    exec: usr/bin/python3
    exec_args: -m aurorawaves $@
  apt:
    arch: amd64
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble main universe
        key_url: http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
    include: [python3, python3-gi, gir1.2-glib-2.0, mpv, ffmpeg, libxkbcommon-x11-0, libxcb-cursor0, libegl1]
  runtime:
    env:
      PYTHONHOME: '${APPDIR}/usr'
      PYTHONPATH: '${APPDIR}/usr/lib/python3/dist-packages'
AppImage:
  arch: x86_64
  update-information: gh-releases-zsync|elblasy33|aurora-waves-app|latest|Aurora_Waves-*x86_64.AppImage.zsync
