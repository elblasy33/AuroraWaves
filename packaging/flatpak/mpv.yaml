# Adapted from Flathub's Celluloid manifest (same sources and checksums).
# mpv is built as a program: the app runs it and talks to it over its IPC socket.
name: mpv
cleanup:
- /include
- /lib/pkgconfig
- /share/applications
- /share/bash-completion
- /share/doc
- /share/icons
- /share/man
- /share/zsh
buildsystem: meson
config-opts:
- -Dbuild-date=false
- -Dalsa=disabled
- -Dlua=enabled
- -Dlibmpv=false
- -Dcplayer=true
sources:
- type: archive
  url: https://github.com/mpv-player/mpv/archive/v0.42.0.tar.gz
  sha256: bcfebbfa2b65a6d88dc97ea18117831072373e38b5785a2afb874ed4df5070dd
  x-checker-data:
    type: anitya
    project-id: 5348
    stable-only: true
    url-template: https://github.com/mpv-player/mpv/archive/v$version.tar.gz
    is-important: true
modules:
- lua5.1/lua-5.1.5.json     # from github.com/flathub/shared-modules
- name: libopenmpt
  config-opts:
  - --disable-static
  - --disable-tests
  - --disable-examples
  - --disable-openmpt123
  - --disable-doxygen-doc
  - --without-portaudio
  cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.la
  - /share/doc
  sources:
  - type: archive
    url: https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.8.10+release.autotools.tar.gz
    sha256: 976d259288c40cd285771f77d09eff3d02514511d5677ecfcfb53be5013317e2
    x-checker-data:
      type: anitya
      project-id: 141468
      stable-only: true
      url-template: https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-$version+release.autotools.tar.gz
- name: ffmpeg
  cleanup:
  - /include
  - /lib/pkgconfig
  - /share/ffmpeg/examples
  config-opts:
  - --enable-shared
  - --disable-static
  - --enable-gnutls
  - --enable-gpl
  - --disable-doc
  - --disable-programs
  - --disable-encoders
  - --disable-muxers
  - --enable-encoder=png
  - --enable-encoder=libjxl
  - --enable-libv4l2
  - --enable-libdav1d
  - --enable-libjxl
  - --enable-libopenmpt
  sources:
  - type: archive
    url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
    sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
    x-checker-data:
      type: anitya
      project-id: 5405
      stable-only: true
      url-template: https://ffmpeg.org/releases/ffmpeg-$version.tar.xz
      is-important: true
- name: libass
  cleanup:
  - /include
  - /lib/*.la
  - /lib/pkgconfig
  config-opts:
  - --disable-static
  sources:
  - type: archive
    url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
    sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
    x-checker-data:
      type: anitya
      project-id: 1560
      stable-only: true
      url-template: https://github.com/libass/libass/releases/download/$version/libass-$version.tar.xz
- name: uchardet
  buildsystem: cmake-ninja
  config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -DBUILD_STATIC=0
  - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
  cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
  - /share/man
  - /lib/cmake
  sources:
  - type: archive
    url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
    sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
    x-checker-data:
      type: anitya
      project-id: 9265
      stable-only: true
      url-template: https://www.freedesktop.org/software/uchardet/releases/uchardet-$version.tar.xz
- name: rubberband
  buildsystem: meson
  config-opts:
  - -Ddefault_library=shared
  cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
  - /lib/ladspa
  sources:
  - type: archive
    url: https://breakfastquay.com/files/releases/rubberband-4.0.0.tar.bz2
    sha256: af050313ee63bc18b35b2e064e5dce05b276aaf6d1aa2b8a82ced1fe2f8028e9
    x-checker-data:
      type: anitya
      project-id: 4222
      stable-only: true
      url-template: https://breakfastquay.com/files/releases/rubberband-$version.tar.bz2
- name: mujs
  cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
  - /lib/libmujs.a
  no-autogen: true
  make-args:
  - release
  - prefix=/app
  make-install-args:
  - prefix=/app
  - install-shared
  sources:
  - type: git
    url: https://github.com/ArtifexSoftware/mujs.git  # official mirror (codeberg was down)
    tag: 1.3.11
    commit: 01a75ff4324ae8a54cae91a26edd38029424edaa
    x-checker-data:
      type: git
      tag-pattern: ^([\d.]+)$
  - type: file
    url: https://www.unicode.org/Public/16.0.0/ucd/UnicodeData.txt
    sha256: ff58e5823bd095166564a006e47d111130813dcf8bf234ef79fa51a870edb48f
  - type: file
    url: https://www.unicode.org/Public/16.0.0/ucd/SpecialCasing.txt
    sha256: 8d5de354eef79f2395a54c9c7dcebbaf3d30fc962d0f85611ea97aa973a0c451
- name: libplacebo
  buildsystem: meson
  cleanup:
  - /include
  - /lib/pkgconfig
  sources:
  - type: git
    url: https://github.com/haasn/libplacebo.git
    tag: v7.387.0
    commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65
    x-checker-data:
      type: git
      tag-pattern: ^v([\d.]+)$
